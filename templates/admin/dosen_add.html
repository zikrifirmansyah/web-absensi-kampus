{% extends "base.html" %}
{% block title %}Tambah Dosen{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="mb-4"><i class="bi bi-person-video3"></i> Tambah Akun Dosen</h3>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" name="nama" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">NIP</label>
            <input type="text" name="nip" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control">
          </div>
          <hr>
          <div class="mb-3">
            <label class="form-label">Username (untuk login dosen)</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="form-text mb-3">
            Dosen memiliki akses baca (read-only) ke rekap absensi seluruh mahasiswa,
            dan dapat mengekspor laporan ke Excel.
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-save"></i> Simpan Akun Dosen
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
