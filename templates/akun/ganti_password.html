{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-4"><i class="bi bi-key-fill"></i> Ganti Password</h3>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Password Lama</label>
            <input type="password" name="password_lama" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password Baru</label>
            <input type="password" name="password_baru" class="form-control" minlength="6" required>
            <div class="form-text">Minimal 6 karakter.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Konfirmasi Password Baru</label>
            <input type="password" name="konfirmasi" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-circle"></i> Simpan Password Baru
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
