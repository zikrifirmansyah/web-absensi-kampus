{% extends "base.html" %}
{% block title %}Login - Absensi Kampus{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-camera-fill" style="font-size: 2.5rem; color:#0d6efd;"></i>
          <h4 class="mt-2">Sistem Absensi Kampus</h4>
          <p class="text-muted small">Login menggunakan akun admin, dosen, atau mahasiswa</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3 small text-muted">
          Akun admin default: <b>admin</b> / <b>admin123</b>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
